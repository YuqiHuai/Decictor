[project]
name = "decictor"
version = "0.1.0"
description = "Decictor: Towards Evaluating the Robustness of Decision-Making in Autonomous Driving Systems (ICSE 2025)"
readme = "README.md"
license = { file = "LICENSE" }
# Upstream targets 3.7.16, but python-build-standalone (what uv installs) has no
# 3.7 builds. 3.8 is the closest version every pinned dependency still ships.
requires-python = "==3.8.*"

dependencies = [
    "loguru",
    "matplotlib",
    "apollo_modules==7.0.2",
    "omegaconf",
    "docker==6.1.3",
    "shapely",
    "networkx",
    "cyber_record",
    "tqdm",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "tsfresh==0.20.1",
    "pymoo==0.4.2.2",
    "hydra-core==1.3.2",
    "tensorflow-cpu==2.9.0",
    "typeguard",
    # Used by the deepcollision baseline (fuzzer/deep_collision/network.py)
    "torch==1.13.1+cu117",
    "torchvision==0.14.1+cu117",
    "torchaudio==0.13.1",
]

[tool.uv]
# This is an application, not an installable package.
package = false
# Force resolution to pick wheels for this platform; some transitive deps of
# tensorflow 2.9 (e.g. tensorflow-io-gcs-filesystem) publish newer versions
# that are aarch64-only.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu117" }
torchvision = { index = "pytorch-cu117" }
torchaudio = { index = "pytorch-cu117" }
