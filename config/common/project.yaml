# ${project_root:} is resolved automatically from the repository location
# (see tools/project_paths.py), so these normally need no editing.
# apollo_root can be overridden on the command line, e.g.
#   python main_fuzzer.py common.apollo_root=/path/to/apollo
# or through the APOLLO_ROOT environment variable.
apollo_root: ${oc.env:APOLLO_ROOT,${project_root:}/software/apollo}
project_root: ${project_root:}
output_root: ${project_root:}/outputs

# container - apollo
container_record_default_folder: /apollo/outputs
force_green: true
delete_record: true
perception_range: null
# basic violation
time_limit: 600 # seconds, the max time for a scenario
stuck_time_limit: 60 # seconds, the max time for stuck of ego
start_time: 0 # start/trigger time for the ego
threshold_dest: 8.0
